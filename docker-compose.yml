# Desarrollo local: `docker compose up --build`
#   Frontend → http://localhost:5173
#   Backend  → http://localhost:8000  (docs en /docs)
services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/worldradio.db
      CORS_ORIGINS: http://localhost:5173
      ADMIN_SYNC_TOKEN: ${ADMIN_SYNC_TOKEN:-dev-token}
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # recarga en caliente
      - backend-data:/data      # la base SQLite sobrevive a los reinicios
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules   # evita pisar node_modules con el del host
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  backend-data:
  frontend-node-modules:
