<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1f45" />
      <stop offset="100%" stop-color="#030816" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="50%" stop-color="#FFC94A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="aura" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Obsidian Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Planetary Celestial Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#22D3EE" stroke-width="6" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="128" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-opacity="0.8" filter="url(#aura)" />

  <!-- Satellite / Radio Waves -->
  <path d="M168 184 A118 118 0 0 1 344 184" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
  <path d="M196 216 A80 80 0 0 1 316 216" fill="none" stroke="#FFF2A3" stroke-width="10" stroke-linecap="round" />

  <!-- Radio Transmission Tower & Star -->
  <path d="M256 220 L234 350 L278 350 Z" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linejoin="round" />
  <path d="M242 290 L270 290" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="220" r="16" fill="url(#goldGrad)" filter="url(#aura)" />

  <!-- Festive Golden Radiance Cross Glints -->
  <path d="M256 80 L256 112 M240 96 L272 96" stroke="#FFC94A" stroke-width="6" stroke-linecap="round" />
  <circle cx="256" cy="96" r="3" fill="#FFF" />
</svg>

